plugins { id 'com.android.application' }

def previewPasswordFile = rootProject.file('.signing/preview-password.txt')
def previewPassword = previewPasswordFile.exists() ? previewPasswordFile.text.trim() : null

android {
    namespace 'com.bencaunt.kt2pose'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bencaunt.kt2pose'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
        ndk { abiFilters 'arm64-v8a' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        preview {
            storeFile rootProject.file('.signing/preview.jks')
            storePassword previewPassword
            keyAlias 'kt2-preview'
            keyPassword previewPassword
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.preview; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions {
        unitTests.all { systemProperty 'kt2.test.output', layout.buildDirectory.dir('test-fixtures').get().asFile.absolutePath }
    }
    packaging {
        // Compress native libraries for a small sideload download. Android extracts
        // them at install. This preview is validated with 4 KB memory pages.
        jniLibs.useLegacyPackaging = true
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
    }
}

dependencies {
    implementation 'com.google.ar:core:1.56.0'
    implementation 'org.opencv:opencv:4.11.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
