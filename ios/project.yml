name: KT2Pose
options:
  bundleIdPrefix: com.bencaunt
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
packages:
  PoseCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  KT2Pose:
    type: application
    platform: iOS
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: KT2Pose
      - path: Vendor/opencv2.framework/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bencaunt.KT2Pose
        PRODUCT_NAME: KT2Pose
        INFOPLIST_FILE: KT2Pose/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: KT2Pose/KT2Pose-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "6"
        OTHER_LDFLAGS: ["$(inherited)", "-lc++", "-lz", "-liconv"]
    dependencies:
      - package: PoseCore
      - framework: Vendor/opencv2.framework
        embed: false
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreImage.framework
      - sdk: CoreML.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
schemes:
  KT2Pose:
    build:
      targets:
        KT2Pose: all
    run:
      config: Debug
